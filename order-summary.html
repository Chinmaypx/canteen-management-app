<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="summary.css">
</head>
<body>
    <div class="summary-container">
        <h1>Order Summary</h1>
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                </tr>
            </thead>
            <tbody id="order-summary">
                <!-- Order details will be populated here -->
            </tbody>
        </table>
        <button onclick="window.location.href='menu.html'">Back to Menu</button>
    </div>

    <script>
        const orderData = JSON.parse(sessionStorage.getItem('orderData'));
        const username = localStorage.getItem('username'); // Retrieve username from local storage

        if (orderData) {
            const orderSummaryTable = document.getElementById('order-summary');
            let totalAmount = 0;

            orderData.items.forEach(item => {
                const price = parseFloat(item.price.toString().replace(/[^0-9.]/g, ''));
                const quantity = parseInt(item.quantity);
                const totalPrice = !isNaN(price) && !isNaN(quantity) ? price * quantity : 0;

                totalAmount += totalPrice;

                const row = `<tr>
                    <td>${item.name}</td>
                    <td>$${price.toFixed(2)}</td>
                    <td>${quantity}</td>
                    <td>$${totalPrice.toFixed(2)}</td>
                </tr>`;
                orderSummaryTable.innerHTML += row;
            });
        }
    </script>
</body>
</html>
