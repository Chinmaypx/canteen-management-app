<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Us</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('Background image.jpg');
            background-size: cover;
            color: #fff;
            text-align: center;
        }

        .rateus-container {
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent black background */
            border-radius: 10px; /* Rounded corners */
            padding: 20px;
            width: 100%; /* Full width */
            max-width: 500px; /* Max width to prevent it from being too large */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Shadow for depth */
            margin: 0 20px; /* Margin to add spacing on the sides */
        }

        .star-rating {
            display: flex;
            justify-content: center;
            margin-bottom: 10px; /* Space below the stars */
        }

        .star {
            font-size: 40px; /* Size of stars */
            color: #ccc; /* Default star color */
            cursor: pointer; /* Pointer cursor on hover */
        }

        .star:hover,
        .star.selected {
            color: #ffd700; /* Gold color for selected stars */
        }

        button {
            padding: 10px 15px; /* Button padding */
            border: none;
            border-radius: 5px; /* Rounded corners */
            background-color: #ffd700; /* Gold color */
            color: #333;
            cursor: pointer;
        }

        button:hover {
            background-color: #f0c040; /* Darker shade on hover */
        }
    </style>
</head>
<body>

<div class="rateus-container">
    <h2>Rate Us</h2>
    <div class="star-rating">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
    </div>
    <button onclick="submitRating()">Submit Rating</button>
</div>

<script>
    const stars = document.querySelectorAll('.star');
    let selectedRating = 0;

    stars.forEach(star => {
        star.addEventListener('click', () => {
            selectedRating = star.getAttribute('data-value');
            updateStarSelection(selectedRating);
        });
    });

    function updateStarSelection(rating) {
        stars.forEach(star => {
            star.classList.remove('selected');
            if (star.getAttribute('data-value') <= rating) {
                star.classList.add('selected');
            }
        });
    }

    function submitRating() {
        if (selectedRating > 0) {
            alert('Rating submitted: ' + selectedRating + ' star' + (selectedRating > 1 ? 's' : ''));
        } else {
            alert('Please select a rating before submitting.');
        }
    }
</script>

</body>
</html>
