<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Orders</title>
    <link rel="stylesheet" href="admin.css"> <!-- Admin CSS for styling -->
</head>
<body>
    <div class="orders-container">
        <h1>Customer Orders</h1>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                    <th>Order Date</th>
                </tr>
            </thead>
            <tbody id="orders-list">
                <!-- Orders will be loaded here -->
            </tbody>
        </table>
    </div>
    <script src="viewOrders.js"></script>
</body>
</html>
